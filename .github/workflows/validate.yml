name: Validate Farm Book

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check JavaScript and cloud contracts
        run: npm run check
      - name: Run all unit and regression tests
        run: npm test
      - name: Install pinned browser test tooling
        run: npm install --no-save --package-lock=false playwright@1.58.2
      - name: Install Chromium and its system dependencies
        run: npx playwright install --with-deps chromium --only-shell
      - name: Verify native storage, startup, Ledger, and offline reload
        run: npm run test:browser
