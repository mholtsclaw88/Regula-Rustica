name: Validate Farm Book

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  notification-sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.12
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: chore_claim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reproduce original ambiguity and verify notification claim migration
        run: psql -X -h 127.0.0.1 -U postgres -d chore_claim_test -f tests/chore-push-claim.postgres.sql
        env:
          PGPASSWORD: synthetic-ci-only
  tests:
    # Playwright 1.58.2 does not install on the current ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check JavaScript and cloud contracts
        run: npm run check
      - name: Run all unit and regression tests
        run: npm test
      - name: Install pinned browser test tooling
        run: npm install --no-save --package-lock=false playwright@1.58.2
      - name: Install browser and its system dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify native storage, startup, Ledger, and offline reload
        run: npm run test:browser
        env:
          STORAGE_TEST_BROWSER: ${{ matrix.browser }}
